  <style>
    :root {
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #eceef3;
      --card: #ffffff;
      --radius: 18px;
      --shadow-sm: 0 1px 2px rgba(17, 24, 39, .04), 0 1px 3px rgba(17, 24, 39, .05);
      --shadow-md: 0 8px 24px -8px rgba(79, 70, 229, .18), 0 2px 6px rgba(17, 24, 39, .05);
    }

    html { scroll-behavior: smooth; }

    body {
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(900px 380px at 12% -80px, #e0e7ff 0%, transparent 60%),
        radial-gradient(700px 320px at 100% -60px, #fce7f3 0%, transparent 55%),
        #fafbff;
      background-attachment: fixed;
      line-height: 1.6;
    }

    ::selection { background: #c7d2fe; color: #1e1b4b; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Sidebar */
    #sidebar {
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      border-radius: 0 24px 24px 0;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    #sidebarOverlay {
      transition: opacity 0.3s ease;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    #sidebar button {
      border-radius: 12px;
      margin: 0 10px;
      width: calc(100% - 20px);
      padding-left: 14px;
      padding-right: 14px;
      transition: background .2s ease, transform .15s ease;
    }
    #sidebar button:hover { background: var(--accent-soft); }
    #sidebar button:active { transform: scale(.98); }
    #sidebar button:hover i, #sidebar button:hover span { color: var(--accent); }

    /* Animations */
    .fade-in { animation: fadeIn 0.45s cubic-bezier(.2,.7,.2,1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes skeletonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .drop-in { animation: dropIn 0.2s ease-out; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .skeleton-card { animation: skeletonPulse 1.4s ease-in-out infinite; border-radius: var(--radius); }

    /* Daftar artikel: dibuat lebih lembut & berasa "kartu" */
    #app { padding-top: 6px; }
    #articleList { display: flex; flex-direction: column; gap: 14px; }

    #articleList a,
    #articleList article,
    #articleList [onclick] {
      transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease, border-color .25s ease, background .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #articleList article,
    #articleList > div > a,
    #articleList > a,
    #articleList > div[onclick],
    #articleList > div > div[onclick] {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px 18px;
    }

    #articleList article:hover,
    #articleList > div > a:hover,
    #articleList > a:hover,
    #articleList > div[onclick]:hover,
    #articleList > div > div[onclick]:hover {
      transform: translateY(-2px);
      border-color: #c7d2fe;
      box-shadow: var(--shadow-md);
    }

    #articleList article:active,
    #articleList a:active { transform: scale(.985); }

    #articleList h1, #articleList h2, #articleList h3 {
      letter-spacing: -0.015em;
      line-height: 1.3;
      color: var(--ink);
    }
    #articleList h2 { font-weight: 800; }
    #articleList p { color: var(--muted); }
    #articleList img { border-radius: 14px; }
    #articleList a { text-decoration: none; }
    #articleList a:hover h1, #articleList a:hover h2, #articleList a:hover h3 { color: var(--accent); }

    /* Judul kategori / pemisah jadi lebih ramah */
    #articleList h1, #articleList h2 { position: relative; }

    /* Fokus keyboard */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line) !important;
      color: var(--muted);
    }

    /* Scrollbar tipis */
    * { scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
