<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){if(/\.pages\.dev$/.test(location.hostname))location.replace("https://docs.clincoo.buzz"+location.pathname+location.search+location.hash);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clincoo Docs - Artikel, Panduan & Tips</title>
<meta name="description" content="Dokumentasi Clincoo — panduan, artikel, dan pusat bantuan.">
<link rel="canonical" href="https://docs.clincoo.buzz/">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@1.41.0"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['\"Plus Jakarta Sans\"','ui-sans-serif','system-ui','sans-serif']}}}}</script>
<style>
body{-webkit-tap-highlight-color:transparent;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif}
.hide-scrollbar::-webkit-scrollbar{display:none}.hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
#sidebar{transition:transform .3s cubic-bezier(.32,.72,0,1);background:#fff;box-shadow:8px 0 32px -12px rgba(17,24,39,.18)}
#sidebarOverlay{transition:opacity .3s ease;background:rgba(17,24,39,.35)}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eceef3}
.sb-head a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#111827}
.sb-head img{border-radius:8px}.sb-head b{font-size:17px;font-weight:800}
.sb-close{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:#9ca3af}
.sb-foot{border-top:1px solid #eceef3;padding:10px 12px;position:relative}
#langBtn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:14px;font-weight:500;text-align:left}
#langDrop{position:absolute;left:12px;right:12px;bottom:calc(100% - 2px);margin-bottom:6px;background:#fff;border:1px solid #eceef3;border-radius:8px;padding:4px;box-shadow:0 12px 32px -8px rgba(17,24,39,.25);z-index:5}
.fade-in{animation:fadeIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#app>header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(236,238,243,.9)}
#searchInput{background:#fff;border:1px solid #eceef3!important;border-radius:999px;box-shadow:0 1px 2px rgba(17,24,39,.04)}
#homeCards>div{border-bottom:1px solid #eceef3;padding:20px 28px 20px 0;position:relative}
#homeCards>div::after{content:"\\2192";position:absolute;right:2px;top:50%;transform:translateY(-50%);color:#d1d5db}
#homeCards h3{font-size:1.05rem;font-weight:700;color:#111827}
#homeCards p{margin-top:6px;font-size:14px;color:#6b7280;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="text-gray-900 font-sans antialiased min-h-screen flex flex-col">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden opacity-0" onclick="toggleSidebar()"></div>

<aside id="sidebar" class="fixed top-0 left-0 h-full w-72 z-[70] transform -translate-x-full flex flex-col border-r border-gray-100">
  <div class="sb-head">
    <a href="/" aria-label="Clincoo Docs">
      <img src="logo.png" width="38" height="38" alt="Clincoo">
      <b>Clincoo Docs</b>
    </a>
    <button onclick="toggleSidebar()" aria-label="Tutup menu" class="sb-close">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>
  <div id="countryDrop" class="flex flex-col flex-1 min-h-0 overflow-y-auto hide-scrollbar"></div>
  <div class="sb-foot">
    <div id="langDrop" class="hidden flex-col"></div>
    <button id="langBtn" onclick="toggleDrop('langDrop')" aria-haspopup="true">
      <i data-lucide="languages"></i>
      <span id="ctaLangText">Indonesia</span>
      <i data-lucide="chevrons-up-down" id="langDropIcon"></i>
    </button>
  </div>
</aside>

<main class="flex-1 w-full max-w-2xl mx-auto px-4 sm:px-6 pb-8">
  <div id="app" class="fade-in"></div>
</main>

<footer class="py-6 mt-12 text-center text-sm w-full max-w-2xl mx-auto px-4 sm:px-6 text-gray-500">
  &copy; 2026 Clincoo. <span id="footerText">Seluruh hak cipta dilindungi.</span>
</footer>

<script src="/data_clincoo.js"></script>
<script src="/app.js"></script>
<script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>
