<script src="/articles.js"></script>
<script>
var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtDate(iso) {
  var p = iso.split('-');
  return parseInt(p[2], 10) + ' ' + BULAN[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function render() {
  var list = (window.blogArticles || []).slice().sort(function(a, b) { return b.date < a.date ? -1 : 1; });
  var el = document.getElementById('articleCards');
  if (list.length === 0) { document.getElementById('noResult').style.display = ''; return; }
  el.innerHTML = list.map(function(a) {
    return '<a data-card data-title="' + esc(a.title) + '" data-desc="' + esc(a.desc) + '" class="mb-4 block border border-gray-200 rounded-[0.5rem] p-5 hover:border-gray-400 transition-colors" href="/' + a.slug + '/">' +
      '<div class="mb-2"><span class="text-xs font-medium text-gray-400 uppercase tracking-wide">' + fmtDate(a.date) + '</span></div>' +
      '<h2 class="text-lg font-bold text-gray-900">' + esc(a.title) + '</h2>' +
      '<div class="h-px bg-gray-100 w-full my-3"></div>' +
      '<p class="text-sm text-gray-500 leading-relaxed">' + esc(a.desc) + '</p>' +
      '</a>';
  }).join('');
}
function filterCards(input) {
  var q = (input.value || '').toLowerCase();
  var any = false;
  var cards = document.querySelectorAll('[data-card]');
  for (var i = 0; i < cards.length; i++) {
    var el = cards[i];
    var ok = (el.getAttribute('data-title') || '').toLowerCase().indexOf(q) > -1 ||
             (el.getAttribute('data-desc') || '').toLowerCase().indexOf(q) > -1;
    el.style.display = ok ? '' : 'none';
    if (ok) any = true;
  }
  document.getElementById('noResult').style.display = any ? 'none' : '';
}
render();
</script>
