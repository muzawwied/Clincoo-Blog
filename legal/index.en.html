:root{--bg:#fff;--surface:#f7f8fa;--text:#111827;--muted:#6b7280;--line:#f0f1f4;--accent:#111827}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;color-scheme:light;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
::selection{background:#e5e7eb;color:#111827}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font:16px/1.75 'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* header */
.seo-header{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;
  background:var(--bg);border:0;border-bottom:0;box-shadow:none;
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:6px max(20px,calc((100% - 720px)/2));
}
.seo-header::after{content:none;display:none}
.seo-back{
  display:inline-flex;align-items:center;margin-left:-12px;padding:4px;
  color:var(--muted);text-decoration:none;background:transparent;border:0;
  transition:color .2s ease,transform .15s ease;
}
.seo-back svg{width:26px;height:26px;flex-shrink:0}
.seo-back:hover{color:var(--text)}
.seo-back:active{transform:scale(.96)}
.seo-head-title{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:15px;font-weight:700;color:var(--text);pointer-events:none;
}

/* konten */
main.seo-main{flex:1 0 auto;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;padding:16px 20px 24px}
main.seo-main .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main.seo-main .seo-title+p{margin:0;font-size:15px;line-height:1.65;color:var(--muted)}

/* breadcrumb */
.seo-crumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 20px;font-size:14px;font-weight:500;line-height:1.4}
.seo-crumb a{color:var(--muted);text-decoration:none;transition:color .2s ease}
.seo-crumb a:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.seo-crumb .sep{color:#d1d5db;font-weight:400}
.seo-crumb [aria-current]{color:var(--text);font-weight:700}

/* daftar artikel */
.art-list{display:flex;flex-direction:column;margin-top:24px;border-top:1px solid var(--line)}
.art-row{
  display:flex;align-items:center;gap:16px;padding:20px 4px;
  border-bottom:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s ease;
}
.art-row:last-child{border-bottom:0}
.art-row:active{background:#f7f7f8}
.art-body{flex:1;min-width:0}
.art-title{margin:0;font-size:17px;font-weight:700;line-height:1.4;letter-spacing:-.01em;color:var(--text)}
.art-desc{
  margin:6px 0 0;font-size:14px;line-height:1.55;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.art-arrow{flex-shrink:0;width:18px;height:18px;color:#d1d5db;transition:color .15s ease,transform .15s ease}
.art-row:hover .art-arrow{color:var(--text);transform:translateX(3px)}
.art-row:hover .art-title{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* footer */
.seo-footer{margin-top:auto;padding-top:48px;font-size:13.5px;color:var(--muted);border:0;box-shadow:none}
.seo-footer::before{content:none;display:none}
.seo-footer a{color:var(--muted);text-decoration:none;margin:0 2px}
.seo-footer a:hover{color:var(--text);text-decoration:underline}

@media (max-width:600px){main.seo-main{padding:16px 18px 20px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.art-row,.art-arrow,.seo-back{transition:none}}
@media print{.seo-header{display:none}main.seo-main{padding:0}}
